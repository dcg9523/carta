<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Manu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lora', serif; background-color: #fcfcfc; overflow: hidden; margin: 0; padding: 0; }
        .cursive { font-family: 'Dancing Script', cursive; }
        
        /* Animaciones del sobre */
        .envelope-wrapper { perspective: 1000px; transition: transform 0.8s ease-in-out; }
        .envelope { transition: transform 1s ease-in-out; transform-style: preserve-3d; }
        .envelope-flap { transform-origin: top; transition: transform 0.8s ease-in-out; }
        
        .open .envelope-flap { transform: rotateX(180deg); z-index: 0; }
        .open .letter-container { transform: translateY(-100px); opacity: 1; z-index: 60; transition: transform 1s ease-in-out 0.5s, opacity 0.5s 0.5s; }
        .open .envelope-wrapper { transform: translateY(150px); opacity: 0; pointer-events: none; transition: transform 1s ease-in-out 1.5s, opacity 1s 1.5s; }
        
        /* Animación del corazón latiendo */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        .heart-seal { animation: heartbeat 2s infinite ease-in-out; cursor: pointer; }
        
        /* Carta modo lectura */
        .reading-mode .letter-container { transform: translateY(0) scale(1.05); transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); height: 85vh; width: 90vw; max-width: 500px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .page { display: none; opacity: 0; transition: opacity 0.5s; }
        .page.active { display: flex; opacity: 1; }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative bg-[#fcfcfc]">

    <!-- Pantalla inicial: Sobre cerrado -->
    <div id="envelope-scene" class="envelope-wrapper absolute z-50 flex flex-col items-center cursor-pointer w-full h-full justify-center" onclick="openEnvelope()">
        <p class="mb-6 text-gray-500 tracking-widest uppercase text-sm animate-pulse">Toca el corazón para abrir</p>
        <div class="envelope relative w-80 h-52 bg-white shadow-2xl rounded-sm border border-gray-100">
            <!-- Solapa superior -->
            <div class="envelope-flap absolute top-0 left-0 w-0 h-0 border-l-[160px] border-r-[160px] border-t-[100px] border-transparent border-t-gray-100 z-30 drop-shadow-sm pointer-events-none"></div>
            <!-- Sello de corazón -->
            <div class="heart-seal absolute top-[75px] w-full flex justify-center z-40 text-red-500 text-5xl drop-shadow-md">
                ❤️
            </div>
            <!-- Solapas laterales e inferior -->
            <div class="absolute inset-0 border-l-[160px] border-r-[160px] border-b-[110px] border-transparent border-b-white border-l-gray-50 border-r-gray-50 z-20 pointer-events-none"></div>
        </div>
    </div>

    <!-- Carta que sale del sobre -->
    <div id="letter" class="letter-container absolute bg-white w-72 h-96 p-6 sm:p-8 rounded shadow-xl flex flex-col justify-between opacity-0 z-10 border border-gray-100">
        
        <!-- Contenido dinámico de las páginas -->
        <div id="pages-container" class="flex-grow flex flex-col justify-center text-gray-700 text-[14px] leading-relaxed relative overflow-hidden">
            <!-- Las páginas se insertan aquí vía JS -->
        </div>

        <!-- Controles de navegación -->
        <div id="controls" class="hidden mt-4 justify-between items-center border-t border-gray-100 pt-4">
            <button onclick="prevPage()" class="text-gray-400 hover:text-red-500 px-3 py-1 font-semibold transition text-sm">&larr; Anterior</button>
            <span id="page-indicator" class="text-xs text-gray-300">1 / 5</span>
            <button onclick="nextPage()" class="text-gray-400 hover:text-red-500 px-3 py-1 font-semibold transition text-sm">Siguiente &rarr;</button>
        </div>
    </div>

    <script>
        const pages = [
            `<strong>Manu &lt;3,</strong><br><br>Sabes que puedo ser mejor con las letras que con el verbo. Ayer te sentí distante y como que no querías contarme nada más de tu vida. Llevo escribiendo esto 5 días en mi cabeza, tratando de poner todos mis pensamientos en un mensaje directo para poder expresar lo que siento por ti, y trataré de hacerlo de la manera más honesta posible.<br><br>Si llegas aquí y definitivamente durante estos días has pensado que no soy una persona que quieras en tu vida, lo entiendo; reacciona a este mensaje con un corazón negro, lo entenderé y me haré a un lado.<br><br>Si decides no reaccionar con el corazón negro, esto es lo que te quiero decir: Creo que hace ya 5 años no pasaba días tan grises; mi cabeza a 1000 revoluciones, la sensación de que algo me falta, la incertidumbre y muchas otras cosas que no son el foco de esto, pero ahí están.<br><br>Cuando me dices que estás bien me alegro de corazón porque no quiero menos para ti, pero mi corazón duele de solo pensar que tal vez ya estés creando un mecanismo para olvidarme a pasos agigantados, o que en este tiempo te dieras cuenta de que no soy la persona que quieres a tu lado (lo cual puede ser posible, porque eres más de acciones y nunca me dijiste que no querías que me fuera). Cuando hablaste el miércoles en pasado: “me imaginé, sí quería, mis planes eran…”, eso me devastó. Pero yo sí te lo quiero decir: NO QUIERO TENERTE LEJOS UN SEGUNDO MÁS, y tampoco quiero esperar a que una vida contigo sea el sueño o la oportunidad de alguien más, porque ya estoy aquí.`,
            
            `Yo sé que la cagué y que tengo tanto por mejorar, pero yo no quiero hablar en pasado. Yo sí quiero comprar un apto, pero vivir contigo; yo sí quiero un carro para pasear y disfrutar contigo; yo sí quiero tener a Alicia, pero contigo; sí quiero ser exitoso y rico para compartir todo contigo; sí quiero despertar cada mañana y ver esa carita preciosa que tienes, verte estirar y lanzarme esa sonrisa pícara que tienes mientras me dices "buenos días, amorcito"; sí quiero ver ese espectacular cabello multicolor y esos ojos cafés intensos diariamente, por los cuales los míos se inundan de amor.<br><br>Sí quiero hacerte el amor todos los días, sí quiero que me toques cuando mis vecinos nos están mirando, sí quiero ir a la tienda tomando tu mano y escuchar “amorcito, me porté muy bien hoy y creo que me merezco un dulcecito” mientras me haces un puchero. Sí quiero escribir más páginas en tu libreta de apuntes, sí quiero que me mandes reels de Instagram divertidos y lindos imaginándonos una vida juntos. Sí quiero ser la persona a la que acudas cuando estás feliz o triste; sí quiero poder abrir mis ojos y admirar tu nariz, tu rostro, tus cejas, tu cabello, tu piel, tus labios, tus senos, tus nalgas, tu ser.<br><br>Sí quiero ser la persona con la cual disfrutas hablar, reír, bailar, ir al supermercado, ir a un concierto, comer, o simplemente estar cerca sin hablar, y con la que te sientes segura. Sí quiero ser tu amorcete, tu cielo, tu mejor amigo, tu novio, tu esposo, tu confidente en los días malos y buenos, y si llegaste hasta aquí y me permites ser pretencioso y egoísta… El amor de tu vida.`,
            
            `Sé que te hice daño de alguna manera con mis obsesiones y por mi falta de comunicación y carácter, por mi desconfianza y mis celos; que no puedo prometer que no vaya a ser celoso nunca, o que no me vayan a molestar actitudes y palabras, que no me va a molestar que haya gente del pasado cerca, o que desconfíe de las intenciones de otras personas (pero nunca de las tuyas). Pero estas son cosas que están conmigo, y durante estos días me he dado cuenta de que puedo, quiero y voy a cambiar, porque para mí eres la persona más valiosa que he podido encontrar en todos mis años en búsqueda de mi amor bonito (yo sé que soy muy cursi a veces).<br><br>Sí, hablaré, preguntaré y me expresaré en los momentos correctos; y si tú llegaste hasta este punto, son cosas que, si decides no abandonar el barco, las podemos hablar todas.<br><br>No quiero mi felicidad ni tu felicidad por separado, quiero que todo sea nuestra felicidad, y que cuando las cosas se pongan complejas no nos preguntemos nunca más "¿qué somos?", porque la única respuesta a eso espero que sea esa: somos. No quiero que pienses solo en mí, quiero que pienses en ti y en nosotros. Me cansé de sentir temor, me cansé de fingir espacios, distancias y silencios innecesarios. Yo lo que quiero es apostarlo todo aquí y ahora; así Valentina me esté odiando, así Daniel me esté odiando, así tu familia diga que soy un tonto por haber hecho lo que hice, yo quiero estar contigo y solo contigo, lo demás lo arreglo después.`,
            
            `Cada "te amo", cada "te admiro", cada "estás preciosa", cada "no me interesa nadie más", cada "¿estás bien?", cada "¿ya comiste?", cada "¿pediste la cita?", cada "no" necesario, cada "¿y si haces esto?" han sido desde mi total honestidad y amor. Yo no pretendo controlar tu vida, ni tus finanzas, ni nada; yo lo único que quiero es estar para hacerte la vida más sencilla si está a mi alcance.<br><br>Ayer salí y cada lugar que recorrí solo podía imaginármelo contigo; comí ramen y te quería a mi lado; fui a un lugar espectacular al que quisiera ir contigo; hablé con mis amigos de ti, de lo mucho que te extraño y de lo mucho que quiero estar contigo… Y mi corazón se acelera porque en verdad quiere que tú pienses lo mismo.<br><br>Yo creo que la intención de esta cuarta carta que te he escrito está clara, y tengo muchas más letras que quiero compartir, pero en el transcurso de la vida. Quiero estar a tu lado desde el respeto, el amor, la reciprocidad, la confianza y la claridad. Pero todo esto solo son mis palabras, quisiera conocer las tuyas, lo que no tiene que ser ya, pero si a esto reaccionas con un corazón blanco, entenderé que al menos quieres pensarlo; o si me contestas con un “sí, lo quiero pensar”, también me ayuda a saber qué debo hacer.`,
            
            `Manuela Ríos, te amo demasiado, no te alcanzas a imaginar cuánto… Esta semana me diagnostiqué y soy alejado-de-Manuela-fóbico, creo que ese es el término médico; y eres la cura para mi alma, eso ya lo entendí. Como dije, no me tienes que dar una respuesta inmediata, pero sí quiero saber lo que pasa por tu mente cuando quieras decírmelo y estés lista.<br><br><span class="text-red-500 font-bold text-center block my-4 cursive text-xl sm:text-2xl leading-tight">TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO TE AMO</span><br>Y si llegaste hasta aquí, eres el amor de mi vida y gracias por leerme.`
        ];

        let currentPage = 0;

        function renderPages() {
            const container = document.getElementById('pages-container');
            container.innerHTML = pages.map((text, index) => 
                `<div class="page flex-col h-full overflow-y-auto ${index === 0 ? 'active' : ''}" id="page-${index}">
                    <p class="my-auto whitespace-pre-line">${text}</p>
                </div>`
            ).join('');
            updateControls();
        }

        function openEnvelope() {
            // Evitar que se active más de una vez
            if(document.body.classList.contains('open')) return; 
            
            document.body.classList.add('open');
            setTimeout(() => {
                document.body.classList.add('reading-mode');
                document.getElementById('controls').classList.remove('hidden');
                document.getElementById('controls').classList.add('flex');
            }, 1800);
        }

        function updateControls() {
            document.querySelectorAll('.page').forEach((p, i) => {
                p.classList.toggle('active', i === currentPage);
                if (i === currentPage) p.scrollTop = 0;
            });
            document.getElementById('page-indicator').innerText = `${currentPage + 1} / ${pages.length}`;
        }

        function prevPage() {
            if (currentPage > 0) {
                currentPage--;
                updateControls();
            }
        }

        function nextPage() {
            if (currentPage < pages.length - 1) {
                currentPage++;
                updateControls();
            }
        }

        // Permitir deslizar con el dedo
        let touchStartX = 0;
        const letterElem = document.getElementById('letter');
        
        letterElem.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});
        
        letterElem.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 50) nextPage(); // Swipe izquierda
            if (touchEndX - touchStartX > 50) prevPage(); // Swipe derecha
        }, {passive: true});

        renderPages();
    </script>
</body>
</html>
